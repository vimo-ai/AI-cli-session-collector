[package]
name = "ai-cli-session-collector"
version = "0.1.0"
edition = "2024"
description = "AI CLI 会话收集器 - 支持 Claude Code, Codex CLI 等"
license = "MIT"
repository = "https://github.com/vimo-ai/AI-cli-session-collector"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5"] }
dirs = "5"
clap = { version = "4", features = ["derive"], optional = true }
regex = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
webp = "0.3"
base64 = "0.22"

[features]
cli = ["clap", "regex"]

[[bin]]
name = "validate"
required-features = ["cli"]

[dev-dependencies]
tracing-subscriber = "0.3"
tempfile = "3"
